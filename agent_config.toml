[stt]
model = "saaras:v3"
language = "unknown"
mode = "transcribe"
high_vad_sensitivity = true

[llm]
provider = "gemini"
model = "gemini-3.1-flash-lite"
reasoning_effort = "none"
verbosity = "low"
max_output_tokens = 96
use_websocket = true

[tts]
model = "bulbul:v3"
voice = "kabir"
pace = 1.06
temperature = 0.55
sample_rate = 16000
target_language = "en-IN"

[voice]
min_endpointing_delay = 0.8
